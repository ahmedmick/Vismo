server.port=${SERVER_PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.platform=mysql
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE
# Tell Hikari to test if a connection is still alive before giving it to a query
spring.datasource.hikari.connection-test-query=SELECT 1

# Maximum time (in milliseconds) that Hikari will wait for a connection from the pool
spring.datasource.hikari.connection-timeout=20000

# Maximum amount of time a connection can sit idle in the pool before being retired (e.g., 5 minutes)
spring.datasource.hikari.idle-timeout=300000

# The absolute maximum lifetime of a connection in the pool (e.g., 9 minutes)
# This MUST be shorter than MySQL's wait_timeout (which defaults to 8 hours but is much shorter on Railway)
spring.datasource.hikari.max-lifetime=540000

# Minimum number of idle connections Hikari tries to maintain
spring.datasource.hikari.minimum-idle=2

# Maximum number of actual connections allowed in the pool
spring.datasource.hikari.maximum-pool-size=10