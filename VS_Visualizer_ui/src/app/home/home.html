<div class="home-container">
  <h1 class="home-title">Data Structure & Algorithm Visualizer</h1>
  <p class="home-subtitle">Explore how data structures and algorithms work through interactive visualizations</p>
  
  <div class="cards-container">
    <a mat-card class="section-card info-card" routerLink="/data-structures">
      <mat-card-header>
        <mat-card-title>
          <mat-icon class="card-icon">storage</mat-icon>
          Data Structures
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="card-description">Visualize how data structures store and organize data</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary">Explore</button>
      </mat-card-actions>
    </a>

    <a mat-card class="section-card info-card" routerLink="/algorithms">
      <mat-card-header>
        <mat-card-title>
          <mat-icon class="card-icon">account_tree</mat-icon>
          Algorithms
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p class="card-description">Visualize how algorithms process and manipulate data</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="accent">Explore</button>
      </mat-card-actions>
    </a>
  </div>
</div>
